services:
  app:
    build: .
    container_name: expense_mcp_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mcp_network

  db:
    image: postgres:16-alpine
    container_name: expense_mcp_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-expense_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp_network

  redis:
    image: redis:7-alpine
    container_name: expense_mcp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mcp_network

networks:
  mcp_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: